[package]
name = "emu-frontend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "emu_frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
thiserror = "2.0.21"

[build-dependencies]
tauri-build = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep dev builds snappy but make heavy deps (sqlite, image) fast at runtime.
[profile.dev.package."*"]
opt-level = 2
