40 810Q630 740 810 660" stroke="#d7c9a9" stroke-width="19" opacity=".4" fill="none"/>'}`}<g fill="${palette[2]}" opacity=".5"><circle cx="330" cy="170" r="2"/><circle cx="580" cy="120" r="2"/></g></svg>`;
 }
 games.unshift({name:'Tenchu: Wrath of Heaven',console:'PlayStation 2',year:'2003',genre:'Action · Stealth',time:'9h 06m',scene:'sun',cover:'linear-gradient(160deg,#7e252b,#a43a32 52%,#2d252a)',description:'Follow the path of the ninja through guarded castles, secluded villages and moonlit rooftops. Choose your route, watch the patrols, and use stealth, tools and precise attacks to complete each mission. Three playable assassins bring different abilities to the adventure, with new techniques to discover as you explore. Take your time and find another way through when a direct approach is too dangerous.'});
 games[1].description='Explore the rain-soaked ruins, tangled forests and abandoned machinery of an isolated world. Scan your surroundings to uncover its history, discover new abilities, and return to old paths with new ways forward. Quiet exploration gives way to dangerous encounters as you descend further into the unknown. Every upgrade changes how you read the landscape and brings another hidden corner within reach.';
 const entries=[];
 function restore(state,s){
  if(Number.isInteger(s?.gameIndex)&&s.gameIndex>=0&&s.gameIndex<games.length)state.index=s.gameIndex;
  if(s?.platform==='All games'||games.some(g=>g.console===s?.platform))state.system=s.platform;
  if(state.system!=='All games'&&games[state.index].console!==state.system)state.index=games.findIndex(g=>g.console===state.system);
 }
 root.querySelectorAll('.ks-screen').forEach((screen,n)=>{
  const layout=screen.dataset.layout;
  const state={index:0,height:layout==='header'?305:layout==='focus'?410:370,turned:false,flipped:false,browsing:false,system:'All games'};
  restore(state,window.openai?.widgetState?.modelContent);
  screen.innerHTML='<div class="ks-background"></div><div class="ks-shade"></div><main class="ks-body"><nav class="ks-rail" aria-label="Games"></nav><div class="ks-wide-art"></div><div class="ks-case-area"><div class="ks-box"><div class="ks-spine"></div><div class="ks-spine ks-spine-right" aria-hidden="true"></div><div class="ks-top-edge"></div><div class="ks-front"><div class="ks-band"></div><div class="ks-cover-scene"></div><div class="ks-cover-name"></div></div><div class="ks-back"><h3></h3><p></p><div class="ks-back-code" aria-hidden="true"></div></div></div><div class="ks-case-actions"><button type="button" data-action="turn">Turn case</button><button type="button" data-action="flip">Flip</button></div></div><section class="ks-story" aria-label="Selected game" aria-live="polite"><p class="ks-console"></p><h2 class="ks-title"></h2><div class="ks-meta"></div><p class="ks-description"></p><div class="ks-actions"><button type="button" class="ks-play" data-action="play"><i data-lucide="play" aria-hidden="true"></i>Play</button><button type="button" class="ks-more" data-action="more">Read more</button><button type="button" class="ks-browse" data-action="browse">Browse games</button></div><div class="ks-image"></div></section></main><footer class="ks-footer"><button type="button" class="ks-system" data-action="systems"><i data-lucide="layers" aria-hidden="true"></i><span>All games</span></button><span>↑ ↓ Choose</span><span class="ks-footer-label">Illustrative artwork · sample library</span><span class="ks-position"></span></footer><div class="ks-modal" hidden><h3></h3><p></p><div class="ks-system-list" hidden></div><button type="button" data-action="close">Back</button></div>';
  const rail=screen.querySelector('.ks-rail'),modal=screen.querySelector('.ks-modal');
  function visible(){return games.map((g,i)=>({g,i})).filter(({g})=>state.system==='All games'||g.console===state.system);}
  function render(){
   const railHadFocus=rail.contains(document.activeElement);
   const g=games[state.index],list=visible(),at=list.findIndex(x=>x.i===state.index);
   const from=Math.min(Math.max(0,at-2),Math.max(0,list.length-5));
   screen.style.setProperty('--ks-case-height',state.height+'px');
   screen.classList.toggle('ks-browsing',state.browsing);
   screen.querySelector('.ks-background').innerHTML=scenery(g.scene,'show-bg-'+n,'slice');
   screen.querySelector('.ks-case-area').style.setProperty('--ks-light',g.cover.match(/#[0-9a-f]{6}/i)?.[0]||'#a77d54');
   screen.querySelector('.ks-cover-scene').innerHTML=scenery(g.scene,'show-cover-'+n,'slice');
   screen.querySelector('.ks-wide-art').innerHTML=scenery(g.scene,'show-wide-'+n,'meet');
   screen.querySelector('.ks-image').innerHTML=scenery(g.scene,'show-image-'+n,'meet')+'<span class="ks-art-label">Artwork</span>';
   const box=screen.querySelector('.ks-box');box.style.setProperty('--ks-cover',g.cover);box.style.transform=`rotateY(${(state.flipped?180:0)+(state.turned?-18:18)}deg)`;
   screen.querySelector('.ks-spine').textContent=g.name;
   screen.querySelector('.ks-band').textContent=g.console;
   screen.querySelector('.ks-cover-name').textContent=g.name;
   screen.querySelector('.ks-back h3').textContent=g.name;
   screen.querySelector('.ks-back p').textContent=g.description.slice(0,170)+'…';
   screen.querySelector('.ks-console').textContent=g.console;
   screen.querySelector('.ks-title').textContent=g.name;
   screen.querySelector('.ks-meta').textContent=`${g.year} · ${g.genre} · ${g.time} played`;
   screen.querySelector('.ks-description').textContent=g.description;
   screen.querySelector('.ks-position').textContent=`${at+1} / ${list.length}`;
   screen.querySelector('.ks-system span').textContent=state.system==='All games'?'All platforms':state.system;
   screen.querySelector('[data-action="browse"]').textContent=state.browsing?'Close game list':'Browse games';
   rail.innerHTML='<div class="ks-rail-title">Platform filter</div><button type="button" class="ks-platform-filter" data-action="systems" aria-haspopup="dialog"><i data-lucide="layers" aria-hidden="true"></i><span>'+ (state.system==='All games'?'All platforms':state.system) +'</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>'+list.slice(from,from+5).map(({g,i})=>`<button type="button" class="ks-game" data-game="${i}" aria-pressed="${i===state.index}"><span class="ks-logo ks-logo-${i%4}">${g.name}</span><small>${g.console}</small></button>`).join('')+'<div class="ks-rail-arrows"><button type="button" class="ks-arrow" data-step="-1" aria-label="Previous game"><i data-lucide="chevron-up" aria-hidden="true"></i></button><button type="button" class="ks-arrow" data-step="1" aria-label="Next game"><i data-lucide="chevron-down" aria-hidden="true"></i></button></div>';
   if(railHadFocus){const target=layout==='focus'&&!state.browsing?screen.querySelector('.ks-browse'):rail.querySelector('[aria-pressed="true"]');target?.focus({preventScroll:true});}
   if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
  }
  function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{layout:screen.closest('[data-variant]').dataset.variant,gameIndex:state.index,game:games[state.index].name,caseHeight:state.height,platform:state.system},privateContent:null}).catch(()=>{});}
  function choose(index){state.index=index;state.flipped=false;state.turned=false;state.browsing=false;render();remember();}
  function move(d){const list=visible(),at=list.findIndex(x=>x.i===state.index);choose(list[(at+d+list.length)%list.length].i);}
  let modalMode='more';
  function close(){modal.hidden=true;screen.querySelector(modalMode==='systems'?'.ks-platform-filter':'.ks-play').focus();}
  function open(mode){
   modalMode=mode;modal.hidden=false;
   const g=games[state.index],title=modal.querySelector('h3'),text=modal.querySelector('p'),systems=modal.querySelector('.ks-system-list');
   systems.hidden=mode!=='systems';text.hidden=mode==='systems';
   title.textContent=mode==='systems'?'Choose a platform':mode==='play'?'Launch preview':g.name;
   text.textContent=mode==='play'?g.name:g.description;
   if(mode==='systems')systems.innerHTML=['All games',...new Set(games.map(g=>g.console))].map(s=>`<button type="button" data-system="${s}" aria-pressed="${s===state.system}"><span>${s==='All games'?'All platforms':s}</span><small>${games.filter(g=>s==='All games'||g.console===s).length} games</small></button>`).join('');
   (mode==='systems'?systems.querySelector('button'):modal.querySelector('[data-action="close"]')).focus();
  }
  screen.addEventListener('click',e=>{
   const b=e.target.closest('button');if(!b)return;
   if(b.dataset.game!==undefined){choose(Number(b.dataset.game));return;}
   if(b.dataset.step){move(Number(b.dataset.step));return;}
   if(b.dataset.system){state.system=b.dataset.system;if(!visible().some(x=>x.i===state.index))state.index=visible()[0].i;modal.hidden=true;render();screen.querySelector('.ks-platform-filter').focus();remember();return;}
   switch(b.dataset.action){case 'turn':state.turned=!state.turned;render();break;case 'flip':state.flipped=!state.flipped;render();break;case 'browse':state.browsing=!state.browsing;render();break;case 'more':open('more');break;case 'play':open('play');break;case 'systems':open('systems');break;case 'close':close();break;}
  });
  screen.addEventListener('keydown',e=>{
   if(e.key==='Escape'){if(!modal.hidden)close();else{state.browsing=false;render();}return;}
   if(!modal.hidden){
    if(modalMode==='systems'&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
     e.preventDefault();const buttons=[...modal.querySelectorAll('[data-system]')];const at=Math.max(0,buttons.indexOf(document.activeElement));const d=e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1;buttons[(at+d+buttons.length)%buttons.length].focus();
    }
    return;
   }
   if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();move(e.key==='ArrowUp'?-1:1);}
   if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();state.turned=e.key==='ArrowLeft';render();}
  });
  entries.push({screen,state,render});render();
  if(globalThis.Tweak){const tweak=new Tweak({container:screen,onChange:render});tweak.addSlider(state,'height',{label:'Selected case height',min:280,max:420,unit:'px'});}
 });
 window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;const entry=entries.find(x=>x.screen.closest('[data-variant]').dataset.variant===s?.layout);if(entry){restore(entry.state,s);entry.render();}});
})();
</script>
