  const state={index:Number.isInteger(saved?.gameIndex)?Math.max(0,Math.min(7,saved.gameIndex)):0,favorite:false,showDescription:true,contain:layout==='gallery',safe:4};
  const top=`<header class="kb-top"><div class="kb-brand">K<span>B</span> <span aria-hidden="true">/</span> KaneegaBell</div><nav class="kb-nav" aria-label="Library"><button type="button" data-tab="all" aria-pressed="true">All games</button><button type="button" data-tab="favorites" aria-pressed="false">Favorites</button><button type="button" data-tab="collections" aria-pressed="false">Collections</button></nav><div class="kb-clock">20:42</div></header>`;
  const details=`<div class="kb-detail"><div class="kb-eyebrow"></div><h2 class="kb-title"></h2><div class="kb-facts"></div><p class="kb-description"></p><div class="kb-actions"><button class="kb-play" type="button" data-action="play"><i data-lucide="play" aria-hidden="true"></i>Play</button><button class="kb-secondary" type="button" data-action="favorite" aria-label="Favorite game" aria-pressed="false"><i data-lucide="star" aria-hidden="true"></i></button><button class="kb-secondary" type="button" data-action="details">Details</button></div></div>`;
  const footer=`<footer class="kb-footer"><span><b>← →</b> Choose game</span><span><b>Enter</b> Select</span><span><b>Esc</b> Back</span><span class="kb-sample">Illustrative artwork · sample library</span></footer>`;
  const covers=games.map((g,i)=>`<button type="button" class="kb-case" data-game="${i}" aria-label="${g.title}" aria-pressed="${i===state.index}" style="--cover:${g.cover}"><small>${g.platform}</small><span>${g.title}</span></button>`).join('');
  if(layout==='channels'){
   screen.innerHTML=top+`<div class="kb-channel-grid" aria-label="Game channels">${games.map((g,i)=>`<button type="button" class="kb-channel" data-game="${i}" aria-label="${g.title}" aria-pressed="${i===state.index}"><div class="kb-channel-art">${scenery(g.art,'channel-'+i)}</div><span>${g.title}</span></button>`).join('')}${Array.from({length:4},()=>'<div class="kb-channel empty"><span>KB</span></div>').join('')}</div>`+details+footer;
  }else if(layout==='crossbar'){
   const cats=[['settings','Settings'],['image','Photos'],['folder','Collections'],['gamepad-2','Games'],['star','Favorites'],['clock','Recent']];
   screen.innerHTML='<div class="kb-art"></div><div class="kb-shade"></div><div class="kb-wave"></div><div class="kb-wave second"></div>'+top+`<nav class="kb-crossnav" aria-label="Cross-bar categories">${cats.map(([icon,label])=>`<button type="button" data-category="${label}" aria-pressed="${label==='Games'}"><i data-lucide="${icon}" aria-hidden="true"></i>${label}</button>`).join('')}</nav><div class="kb-crosslist" aria-label="Games"></div>`+details+footer;
  }else{
   screen.innerHTML='<div class="kb-art"></div><div class="kb-shade"></div>'+top+details+`<button type="button" class="kb-art-control" data-action="fit">Whole artwork</button><div class="kb-shelf" aria-label="Game shelf">${covers}</div>`+footer;
  }
  screen.insertAdjacentHTML('beforeend','<div class="kb-overlay" hidden><div class="kb-eyebrow">Launch preview</div><h3></h3><button type="button" data-action="close">Back to library</button></div>');
  const render=()=>{
   const g=games[state.index];
   const art=screen.querySelector('.kb-art');
   if(art){art.innerHTML=scenery(g.art,layout);art.querySelector('svg').setAttribute('preserveAspectRatio',state.contain?'xMidYMid meet':'xMidYMid slice');}
   screen.querySelector('.kb-title').textContent=g.title;
   screen.querySelector('.kb-eyebrow').textContent=g.subtitle||g.platform;
   screen.querySelector('.kb-facts').textContent=`${g.platform}  ·  ${g.year}  ·  ${g.genre}  ·  ${g.time}`;
   const desc=screen.querySelector('.kb-description');desc.textContent=g.description;desc.hidden=!state.showDescription;
   screen.querySelector('[data-action="favorite"]').setAttribute('aria-pressed',String(state.favorite));
   screen.querySelectorAll('[data-game]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.game)===state.index)));
   const fit=screen.querySelector('[data-action="fit"]');if(fit){fit.textContent=state.contain?'Fill artwork':'Whole artwork';fit.setAttribute('aria-pressed',String(state.contain));}
   if(layout==='crossbar'){
    const list=screen.querySelector('.kb-crosslist');
    list.innerHTML=Array.from({length:4},(_,j)=>{const i=(state.index+j)%games.length;const item=games[i];return `<button type="button" class="kb-crossitem" data-game="${i}" aria-pressed="${j===0}" aria-label="${item.title}"><span class="kb-mini-cover" style="--cover:${item.cover}"><i data-lucide="gamepad-2" aria-hidden="true"></i></span><span>${item.title}<small>${j===0?item.platform+' · '+item.time:'Game'}</small></span></button>`;}).join('');
   }
   screen.querySelector('.kb-overlay h3').textContent=g.title;
   screen.style.setProperty('--kb-safe',state.safe+'%');
   if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
  };
  const remember=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{layout,gameIndex:state.index,game:games[state.index].title,wholeArtwork:state.contain},privateContent:null}).catch(()=>{});};
  screen.addEventListener('click',e=>{
   const button=e.target.closest('button');if(!button)return;
   if(button.dataset.game!==undefined){state.index=Number(button.dataset.game);state.favorite=false;render();remember();return;}
   if(button.dataset.category){screen.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));screen.querySelector('.kb-eyebrow').textContent=button.dataset.category;return;}
   if(button.dataset.tab){screen.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));screen.querySelector('.kb-eyebrow').textContent=button.textContent;return;}
   switch(button.dataset.action){case 'favorite':state.favorite=!state.favorite;render();break;case 'details':state.showDescription=!state.showDescription;render();break;case 'fit':state.contain=!state.contain;render();remember();break;case 'play':screen.querySelector('.kb-overlay').hidden=false;screen.querySelector('[data-action="close"]').focus();break;case 'close':screen.querySelector('.kb-overlay').hidden=true;screen.querySelector('[data-action="play"]').focus();break;}
  });
  screen.addEventListener('keydown',e=>{
   if(e.key==='Escape'){screen.querySelector('.kb-overlay').hidden=true;return;}
   const delta=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
   if(delta){e.preventDefault();state.index=(state.index+delta+games.length)%games.length;state.favorite=false;render();remember();}
  });
  states.push({screen,state,render});
  render();
  if(globalThis.Tweak && !['channels','crossbar'].includes(layout)){
   const tweak=new Tweak({container:screen,onChange:render});
   tweak.addToggle(state,'contain',{label:'Show whole artwork'});
   tweak.addToggle(state,'showDescription',{label:'Description'});
  }
 });
 window.addEventListener('openai:set_globals',e=>{
  const s=e.detail?.globals?.widgetState?.modelContent;if(!Number.isInteger(s?.gameIndex)||s.gameIndex<0||s.gameIndex>=games.length)return;
  const match=states.find(x=>x.screen.dataset.layout===s.layout);if(match){match.state.index=s.gameIndex;match.state.contain=!!s.wholeArtwork;match.render();}
 });
})();
</script>
